<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient (Obsidian to Deep Galactic Navy) -->
    <linearGradient id="nn-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Dynamic Energy Gradient across the 'N' -->
    <linearGradient id="nn-fav-n" x1="22%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#C7D2FE" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radiant Nova Star Gradient -->
    <radialGradient id="nn-fav-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </radialGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#nn-fav-bg)" />
  <rect x="3.75" y="3.75" width="92.5" height="92.5" rx="23.25" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
  
  <!-- Ambient Corner Glow -->
  <circle cx="85" cy="15" r="28" fill="#6366F1" opacity="0.25" />

  <!-- Main Geometric 'N' Monogram -->
  <path
    d="M 22 75 V 25 C 22 23.9 22.9 23 24 23 H 33 C 34.5 23 35.8 23.8 36.5 25.1 L 63.5 64.5 V 25 C 63.5 23.9 64.4 23 65.5 23 H 74.5 C 75.6 23 76.5 23.9 76.5 25 V 75 C 76.5 76.1 75.6 77 74.5 77 H 65.5 C 64 77 62.7 76.2 62 74.9 L 35 35.5 V 75 C 35 76.1 34.1 77 33 77 H 24 C 22.9 77 22 76.1 22 75 Z"
    fill="url(#nn-fav-n)"
  />

  <!-- Overlapping Accent Facet -->
  <path
    d="M 36.5 25.1 L 63.5 64.5 L 62 74.9 L 35 35.5 Z"
    fill="#818CF8"
    opacity="0.3"
  />

  <!-- The Radiant Nova Star (Spark of Knowledge) -->
  <g>
    <circle cx="75" cy="20" r="7" fill="#38BDF8" opacity="0.4" />
    <path
      d="M 75 11 Q 75 20 84 20 Q 75 20 75 29 Q 75 20 66 20 Q 75 20 75 11 Z"
      fill="url(#nn-fav-star)"
    />
    <circle cx="75" cy="20" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
